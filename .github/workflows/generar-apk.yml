name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flet
        run: pip install -r requirements.txt

      - name: Generar el APK
        run: flet build apk --yes --no-rich-output

      - name: Renombrar el APK
        run: |
          ls -la build/apk
          cp "$(ls build/apk/*.apk | head -n 1)" Adherencia.apk

      - name: Guardar el APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Adherencia-apk
          path: Adherencia.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Adherencia versión ${{ github.run_number }}
          body: Descarga Adherencia.apk desde el celular e instálala.
          files: Adherencia.apk
